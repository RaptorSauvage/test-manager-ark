<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manager Log - real ManagerLogView.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .dashboard {
        padding: 24px;
      }
      .dashboard-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 8px;
      }
      .manager-log-feed {
        margin-top: 16px;
        max-height: 70vh;
        overflow-y: auto;
      }
      .manager-log-task {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 10px 14px;
        margin-bottom: 10px;
        background: #1a1d24;
      }
      .manager-log-task-header {
        display: flex;
        gap: 10px;
        margin-bottom: 6px;
      }
      .manager-log-time {
        color: #9aa0ab;
        font-variant-numeric: tabular-nums;
      }
      .manager-log-line {
        margin: 2px 0;
      }
      .error-message {
        color: #ff8080;
      }
      .empty-state {
        color: #9aa0ab;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div id="root"></div>
    <script type="module" src="manager-log.js"></script>
  </body>
</html>
