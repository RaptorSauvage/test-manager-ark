<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Changelog - real ChangelogView.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      h1 {
        font-size: 1.3rem;
      }
      .changelog-entry {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 12px;
        background: #1a1d24;
      }
      .changelog-entry-header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        margin-bottom: 6px;
      }
      .changelog-entry-header h3 {
        margin: 0;
      }
      .changelog-date {
        color: #9aa0ab;
        font-size: 0.85rem;
      }
      li {
        margin-bottom: 4px;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <div id="root"></div>
    </div>
    <script type="module" src="changelog.js"></script>
  </body>
</html>
