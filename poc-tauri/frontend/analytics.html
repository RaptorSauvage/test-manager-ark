<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Analytics - real AnalyticsTab.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      .cluster-section {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      h3 {
        margin-top: 0;
      }
      dl.analytics-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 24px;
      }
      dl.analytics-grid dt {
        color: #9aa0ab;
        font-size: 0.85rem;
      }
      dl.analytics-grid dd {
        margin: 0;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button.time-scale-btn.active {
        background: #3a5f8a;
      }
      input {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      .status-ok {
        color: #3fbf6f;
      }
      .status-warn {
        color: #d9a441;
      }
      .status-offline {
        color: #9aa0ab;
      }
      a {
        color: #8ab4ff;
      }
      svg {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1 style="font-size: 1.3rem">Analytics</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="analytics.js"></script>
  </body>
</html>
