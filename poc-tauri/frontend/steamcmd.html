<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SteamCMD - real SteamCmdView.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      .server-detail-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0;
      }
      h3 {
        margin-top: 0;
      }
      .managed-steamcmd {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      .settings-tab {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .form-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .status-message {
        color: #3fbf6f;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      code {
        background: #0f1115;
        padding: 1px 4px;
        border-radius: 3px;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <div id="root"></div>
    </div>
    <script type="module" src="steamcmd.js"></script>
  </body>
</html>
