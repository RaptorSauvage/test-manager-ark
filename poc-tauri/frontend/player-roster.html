<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Player Roster - real PlayerRosterPanel.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 900px;
      }
      .cluster-section {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      .player-roster-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .player-roster-count {
        color: #9aa0ab;
        font-weight: normal;
      }
      h3 {
        margin-top: 0;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table th,
      .data-table td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #2c303a;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button.btn-delete-backup {
        border-color: #7a3a3a;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      details.server-group {
        margin-bottom: 16px;
      }
      summary {
        cursor: pointer;
        color: #c9cdd6;
        margin-bottom: 8px;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1 style="font-size: 1.3rem">Player Roster</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="player-roster.js"></script>
  </body>
</html>
