<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - real Dashboard.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      input,
      select {
        background: #1a1d24;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      .error-message {
        color: #ff8080;
      }
      .empty-state {
        color: #9aa0ab;
      }
      a {
        color: #8ab4ff;
      }
      /* The real app.css isn't loaded here (same "unstyled but functional" choice every other
         page in this PoC makes) - without it, Dashboard.tsx/HardwareStatsBar.tsx's unstyled
         <img> icons render at their native pixel size (hundreds of px) and push the actual
         server cards off the bottom of the window. This is the minimum needed to keep them
         from dominating the viewport, not an attempt at the real visual design. */
      img {
        max-width: 28px;
        max-height: 28px;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <div id="root"></div>
    </div>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
