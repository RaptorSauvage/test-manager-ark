<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cluster Dashboard - real ClusterDataView.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .time-scale-selector {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button.time-scale-btn.active {
        background: #3a5f8a;
      }
      .cluster-data-row {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 12px;
        background: #1a1d24;
        cursor: pointer;
      }
      .cluster-data-row-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .cluster-data-row-header h3 {
        margin: 0;
      }
      .cluster-data-row-sub {
        color: #9aa0ab;
        font-size: 0.85rem;
      }
      .cluster-data-stats {
        display: flex;
        gap: 24px;
        margin: 10px 0;
      }
      .cluster-data-stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cluster-data-stat span {
        color: #9aa0ab;
        font-size: 0.8rem;
      }
      .cluster-data-chart-note {
        color: #d9a441;
        font-size: 0.8rem;
      }
      .empty-state {
        color: #9aa0ab;
      }
      svg {
        max-width: 100%;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <div id="root"></div>
    </div>
    <script type="module" src="cluster-data.js"></script>
  </body>
</html>
