<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Server Management - real ServerManagementTab.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      h3,
      h4 {
        margin-top: 0;
      }
      .schedule-section {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      .schedule-subsection {
        margin-bottom: 16px;
      }
      .schedule-suboptions {
        margin-left: 20px;
      }
      label {
        display: block;
        margin-bottom: 6px;
      }
      label.checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      select {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.rcon-trigger-card {
        display: inline-flex;
        flex-direction: column;
        margin-right: 8px;
        text-align: left;
      }
      button.rcon-trigger-card.active {
        background: #3a5f8a;
      }
      .schedule-picker-row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 8px;
      }
      .schedule-days-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .schedule-day {
        flex-direction: column;
        font-size: 0.8rem;
      }
      .schedule-countdown {
        color: #8ab4ff;
        font-variant-numeric: tabular-nums;
      }
      .rcon-entry {
        border-top: 1px solid #2c303a;
        padding-top: 10px;
        margin-top: 10px;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      code {
        background: #0f1115;
        padding: 1px 4px;
        border-radius: 3px;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1 style="font-size: 1.3rem">Server Management</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="server-management.js"></script>
  </body>
</html>
