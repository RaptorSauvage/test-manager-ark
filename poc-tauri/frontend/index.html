<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tauri PoC - Bober Server Manager</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
        padding: 24px;
      }
      h1 {
        font-size: 1.1rem;
        margin-top: 0;
      }
      #status {
        color: #9aa0ab;
        margin-bottom: 16px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #1d2027;
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .error {
        color: #e0555b;
      }
    </style>
  </head>
  <body>
    <h1>Tauri shell PoC - real profiles.list() through a Node sidecar</h1>
    <div id="status">Calling profiles_list via Tauri invoke()...</div>
    <ul id="list"></ul>
    <script type="module">
      const { invoke } = window.__TAURI__.core

      const statusEl = document.getElementById('status')
      const listEl = document.getElementById('list')

      invoke('profiles_list')
        .then((profiles) => {
          statusEl.textContent = `Got ${profiles.length} profile(s) from the real store.ts, via the Rust shell -> Node sidecar round trip.`
          for (const p of profiles) {
            const li = document.createElement('li')
            li.textContent = `${p.name} (${p.game}) - ${p.installDir}`
            listEl.appendChild(li)
          }
        })
        .catch((err) => {
          statusEl.textContent = 'Error calling profiles_list:'
          statusEl.classList.add('error')
          const pre = document.createElement('pre')
          pre.textContent = String(err)
          document.body.appendChild(pre)
        })
    </script>
  </body>
</html>
